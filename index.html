<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="cxdy.top — 一个正在生长的个人站点。">
    <meta name="theme-color" content="#181815">
    <title>cxdy.top — In Progress</title>
    <style>
      :root { color-scheme: dark; --ink: #181815; --paper: #f5f2ea; --muted: #a7a398; --line: rgba(245, 242, 234, .14); --accent: #d79a67; --ease-out: cubic-bezier(.16, 1, .3, 1); font-family: "SF Pro Display", "Helvetica Neue", "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      html { background: var(--ink); }
      body { min-width: 320px; min-height: 100dvh; margin: 0; overflow-x: hidden; background: linear-gradient(115deg, rgba(215, 154, 103, .08), transparent 34%), var(--ink); color: var(--paper); }
      a { color: inherit; }
      .page { position: relative; width: min(1400px, calc(100% - 64px)); min-height: 100dvh; margin: 0 auto; display: grid; grid-template-rows: auto 1fr auto; }
      .page::before { position: absolute; inset: 0 auto 0 47%; width: 1px; background: var(--line); content: ""; pointer-events: none; }
      .nav { display: flex; align-items: center; justify-content: space-between; padding: 28px 0; border-bottom: 1px solid var(--line); font-size: .72rem; letter-spacing: .13em; text-transform: uppercase; }
      .brand { font-weight: 600; text-decoration: none; }
      .nav-status { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); }
      .pulse { position: relative; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
      .pulse::after { position: absolute; inset: -4px; border: 1px solid var(--accent); border-radius: inherit; content: ""; animation: pulse 2.8s var(--ease-out) infinite; }
      .hero { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(310px, .92fr); align-items: center; gap: clamp(52px, 9vw, 150px); padding: clamp(72px, 12vw, 166px) 0 clamp(60px, 9vw, 120px); }
      .eyebrow { margin: 0 0 24px; color: var(--accent); font-family: "SF Mono", "Cascadia Mono", monospace; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; }
      h1 { position: relative; z-index: 1; max-width: 720px; margin: 0; font-size: clamp(3.55rem, 8.2vw, 8.4rem); font-weight: 500; letter-spacing: -.075em; line-height: 1.03; }
      h1 span { display: block; padding-left: 0; color: var(--muted); }
      .footer-link { display: inline-flex; align-items: center; gap: 9px; color: var(--paper); font-size: .9rem; font-weight: 500; text-decoration: none; transition: color 220ms ease, transform 220ms var(--ease-out); }
      .footer-link svg { width: 16px; height: 16px; fill: currentColor; transition: transform 220ms var(--ease-out); }
      .footer-link:hover { color: var(--accent); transform: translateX(3px); }
      .footer-link:hover svg { transform: rotate(-8deg); }
      .footer-link:active { transform: scale(.98); }
      .footer-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
      .signal { position: relative; min-height: min(39vw, 520px); overflow: hidden; border: 1px solid var(--line); background: rgba(245, 242, 234, .025); isolation: isolate; }
      .signal::before { position: absolute; inset: 0; z-index: -1; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 48px 48px; content: ""; mask-image: linear-gradient(to bottom, var(--ink), transparent 88%); }
      .signal-label, .signal-index { position: absolute; z-index: 2; color: var(--muted); font-family: "SF Mono", "Cascadia Mono", monospace; font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; }
      .signal-label { top: 22px; left: 22px; }
      .signal-index { right: 22px; bottom: 22px; }
      .orbit { position: absolute; top: 50%; left: 50%; border: 1px solid rgba(245, 242, 234, .26); border-radius: 50%; transform: translate(-50%, -50%); }
      .orbit-one { width: 54%; aspect-ratio: 1; animation: drift-one 12s ease-in-out infinite; }
      .orbit-two { width: 75%; aspect-ratio: 1; border-color: rgba(215, 154, 103, .65); animation: drift-two 15s ease-in-out infinite; }
      .orbit-three { width: 114%; aspect-ratio: 1; animation: drift-three 18s ease-in-out infinite; }
      .radar-sweep { position: absolute; z-index: 1; top: 50%; left: 50%; width: 75%; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(from -35deg, rgba(215, 154, 103, .28), rgba(215, 154, 103, .08) 15deg, rgba(215, 154, 103, 0) 70deg); mask-image: radial-gradient(circle, transparent 0 4%, var(--ink) 4.5% 100%); transform: translate(-50%, -50%) rotate(-90deg); transform-origin: center; animation: radar-sweep 6.5s linear infinite; }
      .needle { position: absolute; z-index: 2; top: 50%; left: 50%; width: 1px; height: 37.5%; transform: translate(-50%, -100%) rotate(-90deg); transform-origin: bottom; background: linear-gradient(to top, var(--accent), transparent); animation: radar-sweep 6.5s linear infinite; }
      .core { position: absolute; z-index: 2; top: 50%; left: 50%; width: 12px; aspect-ratio: 1; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 8px rgba(215, 154, 103, .1); transform: translate(-50%, -50%); }
      .notes { display: grid; grid-template-columns: 1.08fr .92fr; border-top: 1px solid var(--line); }
      .note { padding: 24px 0 29px; }
      .note + .note { padding-left: clamp(64px, 11vw, 168px); }
      .note dt { margin-bottom: 9px; color: var(--muted); font-family: "SF Mono", "Cascadia Mono", monospace; font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; }
      .note dd { margin: 0; font-size: .9rem; letter-spacing: -.01em; }
      @keyframes pulse { 0% { opacity: .75; transform: scale(.35); } 70%, 100% { opacity: 0; transform: scale(1.8); } }
      @keyframes drift-one { 50% { transform: translate(-50%, -50%) rotate(18deg) scale(1.06); } }
      @keyframes drift-two { 50% { transform: translate(-50%, -50%) rotate(-22deg) scale(.94); } }
      @keyframes drift-three { 50% { transform: translate(-50%, -50%) rotate(12deg) scale(1.04); } }
      @keyframes radar-sweep { to { transform: translate(-50%, -50%) rotate(270deg); } }
      .needle { animation-name: radar-needle; }
      @keyframes radar-needle { to { transform: translate(-50%, -100%) rotate(270deg); } }
      @media (max-width: 760px) { .page { width: min(100% - 40px, 600px); } .page::before { display: none; } .nav { padding: 21px 0; } .hero { grid-template-columns: 1fr; gap: 54px; padding: 78px 0 62px; } h1 span { padding-left: 0; } .signal { min-height: 350px; } .notes { grid-template-columns: 1fr; } .note + .note { padding: 19px 0 28px; border-top: 1px solid var(--line); border-left: 0; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main class="page">
      <nav class="nav" aria-label="主导航">
        <a class="brand" href="/" aria-label="cxdy.top 首页">cxdy.top</a>
        <span class="nav-status"><i class="pulse" aria-hidden="true"></i> In progress</span>
      </nav>
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Personal index / 2026</p>
          <h1 id="page-title">在路上，<span>也在构建。</span></h1>
        </div>
        <div class="signal" aria-label="动态雷达扫描">
          <span class="signal-label">Signal / 01</span><span class="signal-index">CXDY.TOP</span>
          <i class="orbit orbit-one" aria-hidden="true"></i><i class="orbit orbit-two" aria-hidden="true"></i><i class="orbit orbit-three" aria-hidden="true"></i><i class="radar-sweep" aria-hidden="true"></i><i class="needle" aria-hidden="true"></i><i class="core" aria-hidden="true"></i>
        </div>
      </section>
      <footer class="notes">
        <dl class="note"><dt>访问链接</dt><dd><a class="footer-link" href="https://github.com/cxdyun" rel="noopener noreferrer" target="_blank"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 4.73c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>GitHub</a></dd></dl>
        <dl class="note"><dt>收录内容</dt><dd>项目 · 思考 · 实验</dd></dl>
      </footer>
    </main>
  </body>
</html>
